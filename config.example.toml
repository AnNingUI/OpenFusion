# OpenFusion configuration
# Default location: ~/.openfusion/config.toml
# OpenFusion runs as an MCP stdio server.

[fusion]
name = "openfusion/fusion"
timeout_secs = 120
worker_timeout_secs = 60
min_workers = 1
retry = 0

[judge]
base_url = "https://api.openai.com"
api = "openai-responses"
api_key = "sk-xxx"
model = "gpt-5.4-mini"

[[workers]]
base_url = "https://api.openai.com"
api = "openai-responses"
api_key = "sk-xxx"
model = "gpt-5.4-mini"
name = "analytical"
personality = ["rational", "logical"]

[[workers]]
base_url = "https://api.anthropic.com"
api = "anthropic-messages"
api_key = "sk-xxx"
model = "claude-sonnet-4.6"
name = "critical"
personality = ["strict", "critical"]

[storage]
max_sessions = 1000
